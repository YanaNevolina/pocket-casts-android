name: Android Onboarding E2E Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - portfolio/onboarding-e2e
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  onboarding-e2e:
    name: Run onboarding E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ONBOARDING_TEST_EMAIL: ${{ secrets.ONBOARDING_TEST_EMAIL }}
      ONBOARDING_TEST_PASSWORD: ${{ secrets.ONBOARDING_TEST_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Cache Android emulator
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: onboarding-e2e-avd-${{ runner.os }}-api34-x86_64-pixel_7-v1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666",'\
          ' OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          ram-size: 4096M
          heap-size: 1024M
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          ram-size: 4096M
          heap-size: 1024M
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/run-onboarding-e2e.sh

      - name: Publish JUnit report
        if: success() || failure()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: app/build/outputs/androidTest-results/connected/**/*.xml
          detailed_summary: true
          include_passed: true
          fail_on_failure: false

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-e2e-android-reports
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            logcat.txt
            dumpsys-processes.txt
            dumpsys-top.txt
          if-no-files-found: warn
